; Programa del dispositivo Sensor UV (PlatformIO).
; Abrir ESTA carpeta (dispositivo) en VS Code con la extensión PlatformIO IDE.
;
; Dos placas:
;   xiao_esp32c3 -> la placa final (Seeed Studio XIAO ESP32C3)
;   esp32c6      -> la ESP32-C6 DevKit prestada para pruebas (usar el puerto que dice "USB")
;
; Se usa pioarduino (versión comunitaria de la plataforma espressif32) porque trae
; Arduino 3.x, necesario para la ESP32-C6; así las dos placas usan la misma versión.

[platformio]
default_envs = xiao_esp32c3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit LTR390 Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

[env:xiao_esp32c3]
board = seeed_xiao_esp32c3

[env:esp32c6]
board = esp32-c6-devkitc-1
