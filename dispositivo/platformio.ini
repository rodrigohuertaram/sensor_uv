; Programa del dispositivo Sensor UV (PlatformIO).
; Abrir ESTA carpeta (dispositivo) en VS Code con la extensión PlatformIO IDE.
;
; Entornos (elegir abajo en la barra de VS Code):
;   xiao_esp32c3        -> programa del dispositivo en la placa final (Seeed Studio XIAO ESP32C3)
;   esp32c6             -> programa del dispositivo en la ESP32-C6 DevKit prestada (puerto "USB")
;   demo_*              -> igual, pero cada segundo cuenta como 1 minuto (para probar y presentar)
;   prueba_componentes_* -> programa aparte que prueba cada pieza: sensor, pantalla, buzzer, boton y dormir
;
; Se usa pioarduino (versión comunitaria de la plataforma espressif32) porque trae
; Arduino 3.x, necesario para la ESP32-C6; así las dos placas usan la misma versión.

[platformio]
default_envs = xiao_esp32c3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit LTR390 Library
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library

[env:xiao_esp32c3]
board = seeed_xiao_esp32c3

[env:esp32c6]
board = esp32-c6-devkitc-1

[env:demo_xiao_esp32c3]
extends = env:xiao_esp32c3
build_flags = ${env.build_flags} -D ACELERACION=60

[env:demo_esp32c6]
extends = env:esp32c6
build_flags = ${env.build_flags} -D ACELERACION=60

[env:prueba_componentes_xiao]
extends = env:xiao_esp32c3
build_flags = ${env.build_flags} -D PRUEBA_COMPONENTES

[env:prueba_componentes_esp32c6]
extends = env:esp32c6
build_flags = ${env.build_flags} -D PRUEBA_COMPONENTES
