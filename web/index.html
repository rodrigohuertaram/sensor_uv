<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
    The path provided below has to start and end with a slash "/".
    It is replaced by the value of the `--base-href` argument of `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Te avisa cuándo reaplicar bloqueador solar según el sol, tu tipo de piel y tu FPS.">
  <meta name="theme-color" content="#F7931E">

  <!-- iPhone: pantalla completa al agregarla a inicio -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sensor UV">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sensor UV</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FFF8F2; }
    /* Pantalla de carga mientras arranca Flutter */
    #carga {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: linear-gradient(#F7931E, #E8432C);
      color: #fff; font: 600 20px system-ui, sans-serif;
      transition: opacity .3s;
    }
    #carga img { width: 96px; height: 96px; border-radius: 22px; animation: latir 1.2s ease-in-out infinite; }
    @keyframes latir { 50% { transform: scale(1.08); } }
  </style>

  <script>
    // ---- Instalacion ("Agregar a inicio") ----
    // El navegador avisa que la app se puede instalar; se guarda el aviso
    // para mostrarlo cuando la persona toque "Instalar app" dentro de Flutter.
    (function () {
      let aviso = null;
      let alCambiar = null;
      const avisar = () => { if (alCambiar) alCambiar(); };

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        aviso = e;
        avisar();
      });
      window.addEventListener('appinstalled', () => { aviso = null; avisar(); });

      window.sensorUvPuedeInstalar = () => aviso !== null;
      window.sensorUvInstalar = async () => {
        if (!aviso) return 'unavailable';
        aviso.prompt();
        const { outcome } = await aviso.userChoice;
        aviso = null;
        avisar();
        return outcome;
      };
      window.sensorUvEsIOS = () =>
        /iphone|ipad|ipod/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      window.sensorUvInstalada = () =>
        window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      window.sensorUvAlCambiar = (callback) => { alCambiar = callback; };

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
      }
    })();
  </script>
</head>
<body>
  <div id="carga">
    <img src="icons/Icon-192.png" alt="">
    Sensor UV
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      const carga = document.getElementById('carga');
      carga.style.opacity = '0';
      setTimeout(() => carga.remove(), 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
