<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
    The path provided below has to start and end with a slash "/".
    It is replaced by the value of the `--base-href` argument of `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Te avisa cuándo reaplicar bloqueador solar según el sol, tu tipo de piel y tu FPS.">
  <meta name="theme-color" content="#122746">

  <!-- iPhone: pantalla completa al agregarla a inicio -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sensor UV">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">

  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>Sensor UV</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #F8F9FF; }
    /* Pantalla de carga mientras arranca Flutter (colores del logo) */
    #carga {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #122746;
      color: #fff; font: 600 20px system-ui, sans-serif;
      transition: opacity .3s;
    }
    #carga img { width: 96px; height: 96px; border-radius: 22px; animation: latir 1.2s ease-in-out infinite; }
    @keyframes latir { 50% { transform: scale(1.08); } }
  </style>

  <script>
    // ---- Instalacion ("Agregar a inicio") ----
    // El navegador avisa que la app se puede instalar; se guarda el aviso
    // para mostrarlo cuando la persona toque "Instalar app" dentro de Flutter.
    (function () {
      let aviso = null;
      let alCambiar = null;
      const avisar = () => { if (alCambiar) alCambiar(); };

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        aviso = e;
        avisar();
      });
      window.addEventListener('appinstalled', () => { aviso = null; avisar(); });

      window.sensorUvPuedeInstalar = () => aviso !== null;
      window.sensorUvInstalar = async () => {
        if (!aviso) return 'unavailable';
        aviso.prompt();
        const { outcome } = await aviso.userChoice;
        aviso = null;
        avisar();
        return outcome;
      };
      window.sensorUvEsIOS = () =>
        /iphone|ipad|ipod/i.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      window.sensorUvInstalada = () =>
        window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
      window.sensorUvAlCambiar = (callback) => { alCambiar = callback; };

      // ---- Datos guardados en el navegador (en modo privado puede no estar disponible) ----
      window.sensorUvLeer = (clave) => {
        try { return localStorage.getItem('sensorUv.' + clave); } catch (e) { return null; }
      };
      window.sensorUvGuardar = (clave, valor) => {
        try { localStorage.setItem('sensorUv.' + clave, valor); } catch (e) {}
      };

      // ---- Mantener la pantalla encendida (Wake Lock) ----
      // El navegador suelta el bloqueo cuando la app deja de verse; al volver se pide de nuevo
      let bloqueoPantalla = null;
      let quierePantallaEncendida = false;
      const pedirPantalla = async () => {
        try {
          bloqueoPantalla = await navigator.wakeLock.request('screen');
          bloqueoPantalla.addEventListener('release', () => { bloqueoPantalla = null; });
        } catch (e) { bloqueoPantalla = null; }
      };
      window.sensorUvPuedeMantenerPantalla = () => 'wakeLock' in navigator;
      window.sensorUvPantallaEncendida = (activar) => {
        quierePantallaEncendida = activar;
        if (!('wakeLock' in navigator)) return;
        if (activar && !bloqueoPantalla) pedirPantalla();
        if (!activar && bloqueoPantalla) { bloqueoPantalla.release(); bloqueoPantalla = null; }
      };
      document.addEventListener('visibilitychange', () => {
        if (quierePantallaEncendida && document.visibilityState === 'visible' && !bloqueoPantalla) {
          pedirPantalla();
        }
      });

      // ---- Ubicación aproximada (el navegador siempre pide permiso) ----
      // Responde "latitud,longitud"; si falla, rechaza con: sin-soporte, permiso,
      // no-disponible o tiempo (tardó demasiado)
      window.sensorUvUbicacion = () => new Promise((resolver, rechazar) => {
        if (!navigator.geolocation) { rechazar('sin-soporte'); return; }
        const motivos = { 1: 'permiso', 2: 'no-disponible', 3: 'tiempo' };
        navigator.geolocation.getCurrentPosition(
          (p) => resolver(p.coords.latitude + ',' + p.coords.longitude),
          (e) => rechazar(motivos[e.code] || 'no-disponible'),
          { enableHighAccuracy: false, timeout: 15000, maximumAge: 600000 });
      });

      // ---- Bluetooth con el dispositivo (Web Bluetooth) ----
      // Funciona en Chrome (Android y computadora) y en Bluefy (iPhone). Mismo formato que
      // la placa: ver lib/protocolo.dart y dispositivo/lib/Protocolo.
      const SERVICIO = '5e6c0001-7a3b-4c2d-9f10-53e05a7b1c01';
      const CH_CONFIG = '5e6c0002-7a3b-4c2d-9f10-53e05a7b1c01';
      const CH_ESTADO = '5e6c0003-7a3b-4c2d-9f10-53e05a7b1c01';
      const CH_ORDENES = '5e6c0004-7a3b-4c2d-9f10-53e05a7b1c01';
      const texto = new TextDecoder();
      const bytes = new TextEncoder();
      const ble = { dispositivo: null, config: null, ordenes: null, porLaPersona: false, avisos: null };

      // Abre los canales y empieza a recibir el estado y las órdenes
      const abrirCanales = async () => {
        const servidor = await ble.dispositivo.gatt.connect();
        const servicio = await servidor.getPrimaryService(SERVICIO);
        ble.config = await servicio.getCharacteristic(CH_CONFIG);
        ble.ordenes = await servicio.getCharacteristic(CH_ORDENES);
        const estado = await servicio.getCharacteristic(CH_ESTADO);
        estado.addEventListener('characteristicvaluechanged',
          (e) => ble.avisos.alEstado(texto.decode(e.target.value)));
        await estado.startNotifications();
        ble.ordenes.addEventListener('characteristicvaluechanged',
          (e) => ble.avisos.alOrden(texto.decode(e.target.value)));
        await ble.ordenes.startNotifications();
      };

      // Si se pierde la conexión sin que la persona la cierre, se intenta reconectar
      // cada 5 segundos durante 1 minuto
      const alPerderConexion = async () => {
        ble.config = null;
        ble.ordenes = null;
        if (ble.porLaPersona || !ble.dispositivo) { ble.avisos.alCambio('desconectado'); return; }
        ble.avisos.alCambio('reconectando');
        for (let intento = 0; intento < 12; intento++) {
          await new Promise((r) => setTimeout(r, 5000));
          if (ble.porLaPersona) break;
          try { await abrirCanales(); ble.avisos.alCambio('conectado'); return; } catch (e) {}
        }
        ble.avisos.alCambio('desconectado');
      };

      window.sensorUvBlePuede = () => !!(navigator.bluetooth && navigator.bluetooth.requestDevice);
      window.sensorUvBleConectar = async (alEstado, alOrden, alCambio) => {
        if (!window.sensorUvBlePuede()) throw new Error('sin-soporte');
        let dispositivo;
        try {
          dispositivo = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICIO] }] });
        } catch (e) {
          throw new Error(e && e.name === 'NotFoundError' ? 'cancelado' : 'error');
        }
        ble.dispositivo = dispositivo;
        ble.porLaPersona = false;
        ble.avisos = { alEstado, alOrden, alCambio };
        dispositivo.addEventListener('gattserverdisconnected', alPerderConexion);
        try {
          await abrirCanales();
        } catch (e) {
          ble.porLaPersona = true;
          if (dispositivo.gatt.connected) dispositivo.gatt.disconnect();
          throw new Error('error');
        }
        return dispositivo.name || 'Sensor UV';
      };
      window.sensorUvBleEnviarConfig = async (t) => {
        if (ble.config) await ble.config.writeValueWithResponse(bytes.encode(t));
      };
      window.sensorUvBleEnviarOrden = async (t) => {
        if (ble.ordenes) await ble.ordenes.writeValueWithResponse(bytes.encode(t));
      };
      window.sensorUvBleDesconectar = () => {
        ble.porLaPersona = true;
        if (ble.dispositivo && ble.dispositivo.gatt.connected) ble.dispositivo.gatt.disconnect();
        else if (ble.avisos) ble.avisos.alCambio('desconectado');
      };

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
      }
    })();
  </script>
</head>
<body>
  <div id="carga">
    <img src="icons/Icon-192.png?v=2" alt="">
    Sensor UV
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      const carga = document.getElementById('carga');
      carga.style.opacity = '0';
      setTimeout(() => carga.remove(), 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
